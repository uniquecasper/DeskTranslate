name: Windows quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      DESKTRANSLATE_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare pinned Python security runtime
        run: ./tools/install_python.ps1
      - name: Install verified environment
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-build-isolation -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Headless quality and pre-deployment gates
        run: python tools/validate.py --predeploy --junitxml .audit/pytest.xml
      - name: Build portable app
        run: |
          python tools/library_sources.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --qualification
      - name: Packaged startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/DeskTranslate/DeskTranslate.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed: $($process.ExitCode)" }
      - name: Verify frozen ownership and crash recovery offscreen
        shell: pwsh
        run: |
          python tools/qualify_frozen_instance.py --component-test --executable dist/DeskTranslate/DeskTranslate.exe --output .audit/packaged-instance.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify frozen OCR, vault and loopback provider
        shell: pwsh
        run: |
          python -c "from threading import Event; from desktranslate.ocr import ModelManager; ModelManager().install('ja',Event(),lambda *args: None); assert ModelManager().installed('ja',verify=True)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $program = "$PWD/dist/DeskTranslate/DeskTranslate.exe"
          $report = "$PWD/.audit/packaged-runtime.json"
          $fixture = "$PWD/tests/fixtures/ja-game.png"
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:PYTHONPATH = ''
          $process = Start-Process -FilePath $program -ArgumentList "--verify-runtime `"$report`" --ocr-fixture `"$fixture`"" -WorkingDirectory $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Frozen runtime verification timed out' }
          if ($process.ExitCode -ne 0) { throw 'Frozen runtime verification failed' }
      - name: Artifact privacy gate
        run: python tools/privacy_scan.py --history --artifacts --output docs/privacy-scan.json
            - name: Capture Codacy check annotations
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path .audit | Out-Null
          $document = @{
            available = $false
            reason = "Codacy evidence has not been collected."
            annotations = @()
          }
          try {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
            $codacy = $null
            for ($attempt = 0; $attempt -lt 12; $attempt++) {
              $result = Invoke-RestMethod -Headers $headers -Uri "$base/commits/$env:HEAD_SHA/check-runs?per_page=100" -ErrorAction Stop
              # Check-run IDs increase as runs are created. Do not sort by completed_at:
              # a newer in-progress run has no completion timestamp yet.
              $codacy = $result.check_runs |
                Where-Object { $_.name -eq "Codacy Static Code Analysis" } |
                Sort-Object id -Descending |
                Select-Object -First 1
              if ($codacy -and $codacy.status -eq "completed") { break }
              Start-Sleep -Seconds 10
            }
            if (-not $codacy) {
              throw "No Codacy check run was found for this pull-request head."
            }
            if ($codacy.status -ne "completed") {
              throw "The newest Codacy check run did not complete during the collection window."
            }

            $annotations = [System.Collections.Generic.List[object]]::new()
            $page = 1
            do {
              $pageItems = @(
                Invoke-RestMethod -Headers $headers -Uri "$base/check-runs/$($codacy.id)/annotations?per_page=100&page=$page" -ErrorAction Stop
              )
              foreach ($annotation in $pageItems) { $annotations.Add($annotation) }
              $page++
            } while ($pageItems.Count -eq 100)

            $document = @{
              available = $true
              check_run_id = $codacy.id
              conclusion = $codacy.conclusion
              annotations = @($annotations.ToArray())
            }
            foreach ($annotation in $annotations) {
              Write-Host ("{0}:{1}-{2} [{3}] {4}: {5}" -f $annotation.path, $annotation.start_line, $annotation.end_line, $annotation.annotation_level, $annotation.title, $annotation.message)
            }
            Write-Host "Collected $($annotations.Count) Codacy annotations."
          } catch {
            $document = @{
              available = $false
              reason = "Codacy evidence collection failed: $($_.Exception.GetType().Name)"
              annotations = @()
            }
            Write-Warning $document.reason
          }
          $document | ConvertTo-Json -Depth 20 | Set-Content -Path .audit/codacy-annotations.json -Encoding utf8
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktranslate-quality-reports
          path: |
            .audit/pytest.xml
            .audit/dependency-audit.json
            .audit/packaged-runtime.json
            .audit/packaged-instance.json
            .audit/codacy-annotations.json
            docs/privacy-scan.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktranslate-windows
          path: |
            dist/*.zip
            dist/*sbom.json
            dist/*provenance.json
            dist/SHA256SUMS.txt
            docs/privacy-scan.json
          retention-days: 14
