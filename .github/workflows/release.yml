name: Build, qualify and publish DeskTranslate 2.1.0
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "src/desktranslate/__init__.py"
permissions:
  contents: write
concurrency:
  group: desktranslate-2-1-0-release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      # GitHub OIDC for keyless Sigstore signing and hosted provenance.
      id-token: write  # nosemgrep
      attestations: write
    runs-on: windows-2022
    timeout-minutes: 210
    env:
      QT_QPA_PLATFORM: offscreen
      DESKTRANSLATE_DATA_DIR: ${{ github.workspace }}/.test-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare pinned Python security runtime
        run: ./tools/install_python.ps1
      - name: Install and validate
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-build-isolation -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/validate.py --predeploy --junitxml .audit/pytest.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; from desktranslate import __version__; from tools.release_support import version_gate,require_release_condition; version_gate(Path.cwd()); require_release_condition(__version__ == '2.1.0', 'This workflow is reserved for the 2.1.0 release')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare verified installer compiler
        run: ./tools/install_inno.ps1
      - name: Prepare matching LGPL library sources
        run: python tools/library_sources.py
      - name: Compile unpublished qualification artifacts
        id: compile
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) { $changes; throw 'Release candidate requires a clean tracked source tree' }
          python tools/build.py --installer --qualification
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke qualification runtime
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/DeskTranslate/DeskTranslate.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
      - name: Verify frozen ownership and crash recovery offscreen
        shell: pwsh
        run: |
          python tools/qualify_frozen_instance.py --component-test --executable dist/DeskTranslate/DeskTranslate.exe --output .audit/packaged-instance.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare verified synthetic OCR qualification
        id: prepare_ocr
        shell: pwsh
        run: |
          python -c "from threading import Event; from desktranslate.ocr import ModelManager; from tools.release_support import require_release_condition; manager=ModelManager(); manager.install('ja',Event(),lambda *args: None); require_release_condition(manager.installed('ja',verify=True), 'Japanese OCR model verification failed')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download and verify the official 2.0.0 installer
        shell: pwsh
        run: |
          $previousInstaller = Join-Path $env:RUNNER_TEMP 'DeskTranslate-2.0.0-Setup-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/DeskTranslate/DeskTranslate/releases/download/v2.0.0/DeskTranslate-2.0.0-Setup-x64.exe' -OutFile $previousInstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $actual = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '2c2aab018c7e34b38fe4b04f3ffb099c6707fbd63d14dbd21546effe43443fe5'
          if ($actual -ne $expected) { throw "Official v2.0.0 installer checksum mismatch: $actual" }
          "DESKTRANSLATE_PREVIOUS_INSTALLER=$previousInstaller" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Qualify portable, installer upgrade, lifecycle and artifact privacy
        shell: pwsh
        run: |
          ./tools/qualify_portable.ps1 -ModelDataDirectory "$env:DESKTRANSLATE_DATA_DIR/models"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/qualify_installer.ps1 -PreviousInstaller $env:DESKTRANSLATE_PREVIOUS_INSTALLER -OcrFixture "$PWD/tests/fixtures/ja-game.png" -ModelDataDirectory "$env:DESKTRANSLATE_DATA_DIR/models" -AllowInstallChanges
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/privacy_scan.py --artifacts --history --trust-local-build --output docs/privacy-scan.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare verified endurance models
        id: prepare_endurance_models
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.prepare_ocr.outcome == 'success' }}
        shell: pwsh
        run: |
          python -c "from threading import Event; from desktranslate.ocr import ModelManager; from tools.release_support import require_release_condition; manager=ModelManager(); manager.install('en',Event(),lambda *args: None); require_release_condition(manager.installed('en',verify=True), 'English OCR model verification failed')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Qualify two-hour steady endurance on the release runtime
        if: ${{ !cancelled() && steps.prepare_endurance_models.outcome == 'success' }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .audit/stop-steady) { Remove-Item -LiteralPath .audit/stop-steady -Force }
          python tools/soak.py --long-running --mode steady --duration 7200 --stop-file .audit/stop-steady --output docs/soak-2h-hosted.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import hashlib,json; from pathlib import Path; from desktranslate import __version__; from tools.release_support import runtime_source_hashes,require_release_condition; r=json.loads(Path('docs/soak-2h-hosted.json').read_text()); q=r.get('resource_qualification'); w=r.get('continuous_worker_qualification'); checks=(r.get('version')==__version__ and r.get('requested_duration_s')==7200 and r.get('mode')=='steady' and r.get('python_version')=='3.12.15' and r.get('completed') is True and r.get('elapsed_s',0)>=7200 and r.get('real_ocr') is True and r.get('synthetic_capture') is True and r.get('loopback_http') is True and r.get('workload_passed') is True and r.get('source_unchanged') is True and r.get('source_hashes')==runtime_source_hashes(Path.cwd()) and r.get('harness_unchanged') is True and r.get('harness_sha256')==hashlib.sha256(Path('tools/soak.py').read_bytes()).hexdigest() and r.get('session_restarts')==0 and r.get('workers_closed') is True and r.get('remaining_children')==0 and isinstance(q,dict) and q.get('qualified') is True and isinstance(w,dict) and w.get('qualified') is True); require_release_condition(checks,'Two-hour steady endurance report is incomplete or does not match this exact release source')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Qualify thirty-minute fault endurance on the release runtime
        if: ${{ !cancelled() && steps.prepare_endurance_models.outcome == 'success' }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .audit/stop-chaos) { Remove-Item -LiteralPath .audit/stop-chaos -Force }
          python tools/soak.py --long-running --mode chaos --duration 1800 --stop-file .audit/stop-chaos --output docs/soak-chaos-hosted.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import hashlib,json; from pathlib import Path; from desktranslate import __version__; from tools.release_support import runtime_source_hashes,require_release_condition; r=json.loads(Path('docs/soak-chaos-hosted.json').read_text()); q=r.get('resource_qualification'); checks=(r.get('version')==__version__ and r.get('requested_duration_s')==1800 and r.get('mode')=='chaos' and r.get('python_version')=='3.12.15' and r.get('completed') is True and r.get('elapsed_s',0)>=1800 and r.get('real_ocr') is True and r.get('synthetic_capture') is True and r.get('loopback_http') is True and r.get('workload_passed') is True and r.get('injected_http_faults',0)>0 and r.get('session_restarts',0)>0 and r.get('source_unchanged') is True and r.get('source_hashes')==runtime_source_hashes(Path.cwd()) and r.get('harness_unchanged') is True and r.get('harness_sha256')==hashlib.sha256(Path('tools/soak.py').read_bytes()).hexdigest() and r.get('workers_closed') is True and r.get('remaining_children')==0 and isinstance(q,dict) and q.get('qualified') is True); require_release_condition(checks,'Thirty-minute fault endurance report is incomplete or does not match this exact release source')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Promote exact-source evidence and build stable artifacts
        shell: pwsh
        run: |
          Copy-Item docs/soak-2h-hosted.json docs/soak-2h.json -Force
          Copy-Item docs/soak-chaos-hosted.json docs/soak-chaos.json -Force
          python -c "import hashlib,json,subprocess; from pathlib import Path; from desktranslate import __version__; from tools.release_support import runtime_source_hashes; root=Path.cwd(); p=root/'docs/manual-qualification.json'; d=json.loads(p.read_text()); d['version']=__version__; d['target']=__version__+' stable'; d['verdict']='Required 2.1.0 release gates passed on the hosted Windows runner; final stable artifacts are rebuilt from this exact commit.'; d['gates'].update({k:True for k in ('clean_windows','installer_upgrade','prolonged_media','media_pipeline','context_bounds')}); d['unsigned_release_approved']=True; d['unsigned_disclosure']='This release uses keyless Sigstore signatures and GitHub build attestations. No Authenticode publisher certificate is configured; Windows may show an unknown-publisher or SmartScreen warning.'; d['notes']='This report is generated only after the release workflow has passed pre-deployment tests, packaged startup, frozen runtime/OCR, installer-upgrade, artifact privacy, two-hour steady endurance and thirty-minute fault endurance on the exact 2.1.0 source.'; d['qualified_application_commit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); d['qualified_application_sha256']=hashlib.sha256(json.dumps(runtime_source_hashes(root),sort_keys=True).encode()).hexdigest(); p.write_text(json.dumps(d,indent=2)+'\\n',encoding='utf-8')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build.py --installer --stable --tag v2.1.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke final stable package
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/DeskTranslate/DeskTranslate.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'Final packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Final packaged startup failed' }
      - name: Requalify final stable installer and portable artifacts
        shell: pwsh
        run: |
          python tools/qualify_frozen_instance.py --component-test --executable dist/DeskTranslate/DeskTranslate.exe --output .audit/packaged-instance.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/qualify_portable.ps1 -ModelDataDirectory "$env:DESKTRANSLATE_DATA_DIR/models"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/qualify_installer.ps1 -PreviousInstaller $env:DESKTRANSLATE_PREVIOUS_INSTALLER -OcrFixture "$PWD/tests/fixtures/ja-game.png" -ModelDataDirectory "$env:DESKTRANSLATE_DATA_DIR/models" -AllowInstallChanges
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/privacy_scan.py --artifacts --history --trust-local-build --output docs/privacy-scan.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign and verify Windows executables and portable archives with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/**/*.exe
            dist/**/*.zip
          verify: true
          verify-cert-identity: https://github.com/uniquecasper/DeskTranslate/.github/workflows/release.yml@refs/heads/main
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Attest hosted build artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/**/*.exe
            dist/**/*.zip
      - name: Generate final SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist -File | Sort-Object Name
          if (-not $files) { throw 'No release files were built.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v2.1.0'
          git rev-parse --verify "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists; refusing to retarget or overwrite it." }
          if ($LASTEXITCODE -ne 1) { throw 'Could not safely check whether the release tag already exists.' }
          $null = Get-Command gh -ErrorAction Stop
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          $evidence = @(
            'docs/manual-qualification.json',
            'docs/soak-2h.json',
            'docs/soak-chaos.json',
            'docs/installer-qualification.json',
            'docs/portable-qualification.json',
            'docs/privacy-scan.json'
          )
          foreach ($path in $evidence) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release evidence: $path" }
          }
          gh release create $tag @assets @evidence --title 'DeskTranslate 2.1.0' --notes-file docs/release-notes-2.1.0.md --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktranslate-2.1.0-release-evidence
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS.txt
            dist/**/*.sigstore.json
            docs/manual-qualification.json
            docs/soak-2h.json
            docs/soak-chaos.json
            docs/installer-qualification.json
            docs/portable-qualification.json
            docs/privacy-scan.json
            .audit/pytest.xml
            .audit/dependency-audit.json
            .audit/packaged-instance.json
          retention-days: 30
